# Agent 3 (seminar 5) branch B: YOLO26-M without the P3 level (layers 14-17 and the P3 head removed).
# P4 out (public layer 19) reads layer 13 only; its cv1 input slice for the removed layer-17 half is folded
# into cv1's batch-norm mean (b_build.py), so the initial checkpoint equals "layer 17 = per-channel constant".
nc: 80
end2end: True
reg_max: 1
scales:
  m: [0.50, 1.00, 512]
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0
  - [-1, 1, Conv, [128, 3, 2]] # 1
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12
  - [-1, 2, C3k2, [512, True]] # 13 (public 13)
  - [-1, 2, C3k2, [512, True]] # 14 (public 19, P4 out; cv1 sliced)
  - [-1, 1, Conv, [512, 3, 2]] # 15 (public 20)
  - [[-1, 10], 1, Concat, [1]] # 16 (public 21)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 17 (public 22, P5 out)
  - [[14, 17], 1, Detect, [nc]] # 18 (public 23, levels P4 and P5)
