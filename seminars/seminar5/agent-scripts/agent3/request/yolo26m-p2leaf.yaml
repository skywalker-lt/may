# Agent 3 (seminar 5) branch C: YOLO26-M plus a leaf P2 level (upsample of layer 16, concat with backbone layer 2,
# C3k2(128)); the leaf feeds only its own head, so layers 0-22 are the public model unchanged.
nc: 80
end2end: True
reg_max: 1
scales:
  m: [0.50, 1.00, 512]
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0
  - [-1, 1, Conv, [128, 3, 2]] # 1
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12
  - [-1, 2, C3k2, [512, True]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15
  - [-1, 2, C3k2, [256, True]] # 16 (P3)
  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18
  - [-1, 2, C3k2, [512, True]] # 19 (P4)
  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5)
  - [16, 1, nn.Upsample, [None, 2, "nearest"]] # 23
  - [[-1, 2], 1, Concat, [1]] # 24
  - [-1, 2, C3k2, [128, True]] # 25 (P2 leaf)
  - [[25, 16, 19, 22], 1, Detect, [nc]] # 26 (P2, P3, P4, P5)
